<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev 2 Redaction Pipeline E2E Test</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      gap: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: #38bdf8;
    }

    .main-container {
      display: flex;
      flex: 1;
      gap: 20px;
      min-height: 0;
    }

    .column {
      flex: 1;
      background: #1e293b;
      border-radius: 8px;
      border: 1px solid #334155;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }

    .column h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #334155;
      color: #94a3b8;
    }

    /* Section 1 Styling */
    .checkout-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: #0f172a;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    .form-group input {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .amount-display {
      font-weight: 600;
      color: #4ade80;
      margin-top: 4px;
    }

    .btn-submit {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* Section 2 Canvas Styling */
    .canvas-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex: 1;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      padding: 12px;
      overflow: auto;
    }

    canvas {
      border: 1px dashed #475569;
      background: #ffffff;
      max-width: 100%;
    }

    /* Section 3 Log Styling */
    .stats-header {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
    }

    .stat-badge {
      background: #0f172a;
      border: 1px solid #334155;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .stat-badge span {
      color: #38bdf8;
    }

    .log-area {
      flex: 1;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-line {
      margin-bottom: 4px;
    }

    .log-info { color: #38bdf8; }
    .log-pass { color: #4ade80; }
    .log-warn { color: #facc15; }
    .log-fail { color: #f87171; }

    /* Actions Bar */
    .actions-bar {
      display: flex;
      gap: 16px;
      justify-content: center;
    }

    .action-btn {
      padding: 12px 24px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-run {
      background: #059669;
      color: white;
    }
    .btn-run:hover { background: #10b981; }

    .btn-leak {
      background: #dc2626;
      color: white;
    }
    .btn-leak:hover { background: #ef4444; }
  </style>
</head>
<body>

  <header>
    <h1>Dev 2 Redaction Pipeline E2E Integration Test</h1>
  </header>

  <div class="main-container">
    <!-- SECTION 1: Real Page -->
    <div class="column" id="section-1">
      <h2>Section 1: Real Page (DOM)</h2>
      <form class="checkout-form" id="fake-checkout-form" onsubmit="return false;">
        <div class="form-group">
          <label for="pwd-input">Password</label>
          <input type="password" id="pwd-input" value="Secret123!">
        </div>

        <div class="form-group">
          <label for="email-input">Email Address</label>
          <input type="email" id="email-input" autocomplete="email" value="user@example.com">
        </div>

        <div class="form-group">
          <label for="fullname-input">Full Name</label>
          <input type="text" id="fullname-input" autocomplete="name" value="Rahul Sharma">
        </div>

        <div class="form-group">
          <label for="card-number-input">Card Number</label>
          <input type="text" id="card-number-input" autocomplete="cc-number" value="4111 1111 1111 1111">
        </div>

        <div class="form-group">
          <label id="phone-label" for="phone-input">Phone:</label>
          <input type="text" id="phone-input" value="9876543210">
        </div>

        <div class="form-group">
          <div id="total-amount-display" class="amount-display">Total: $45.99</div>
        </div>

        <button type="button" class="btn-submit" id="checkout-submit-btn">Submit Payment</button>
      </form>
    </div>

    <!-- SECTION 2: Sanitized View -->
    <div class="column" id="section-2">
      <h2>Section 2: Sanitized View</h2>
      <div class="canvas-container">
        <canvas id="sanitized-canvas" width="340" height="420"></canvas>
      </div>
    </div>

    <!-- SECTION 3: Live Audit Log -->
    <div class="column" id="section-3">
      <h2>Section 3: Live Audit Log</h2>
      <div class="stats-header">
        <div class="stat-badge">Fields Scanned: <span id="stat-scanned">0</span></div>
        <div class="stat-badge">Sensitive Redacted: <span id="stat-redacted">0</span></div>
        <div class="stat-badge">Leakage Violations: <span id="stat-violations">0</span></div>
      </div>
      <div class="log-area" id="audit-log"></div>
    </div>
  </div>

  <div class="actions-bar">
    <button id="btn-run-pipeline" class="action-btn btn-run">Run Full Pipeline</button>
    <button id="btn-simulate-leak" class="action-btn btn-leak">Simulate Leak (Break It On Purpose)</button>
  </div>

  <script type="module">
    import { detectPII } from './pii-patterns.js';
    import { classifyElement, getElementId } from './dom-heuristics.js';
    import { classifySensitivity, classifySensitivityWithConfidence, getConfidenceBadgeColor } from './sensitivity-tiers.js';
    import { redactImage, canvasToBase64 } from './redaction-renderer.js';
    import { processPageForRedaction } from './redaction-engine.js';
    import { auditPayload, assertSafeToSend } from './leakage-auditor.js';

    const auditLogEl = document.getElementById('audit-log');
    const statScannedEl = document.getElementById('stat-scanned');
    const statRedactedEl = document.getElementById('stat-redacted');
    const statViolationsEl = document.getElementById('stat-violations');
    const sanitizedCanvas = document.getElementById('sanitized-canvas');

    const delay = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function log(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      line.textContent = message;
      auditLogEl.appendChild(line);
      auditLogEl.scrollTop = auditLogEl.scrollHeight;
    }

    function clearLog() {
      auditLogEl.innerHTML = '';
    }

    function updateStats(scanned, redacted, violations) {
      statScannedEl.textContent = scanned;
      statRedactedEl.textContent = redacted;
      statViolationsEl.textContent = violations;
    }

    // Helper to draw visual mock of form elements on canvas before redaction
    function drawMockFormCanvas() {
      const canvas = document.createElement('canvas');
      canvas.width = 340;
      canvas.height = 420;
      const ctx = canvas.getContext('2d');

      // Background
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Border / Form frame
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, 320, 400);

      // Elements matching real DOM locations
      const elementsToDraw = [
        { id: 'pwd-input', label: 'Password', y: 30, h: 30, color: '#fecaca' },
        { id: 'email-input', label: 'Email Address', y: 80, h: 30, color: '#bfdbfe' },
        { id: 'fullname-input', label: 'Full Name', y: 130, h: 30, color: '#bfdbfe' },
        { id: 'card-number-input', label: 'Card Number', y: 180, h: 30, color: '#fecaca' },
        { id: 'phone-input', label: 'Phone:', y: 230, h: 30, color: '#bfdbfe' },
        { id: 'total-amount-display', label: 'Total: $45.99', y: 280, h: 24, color: '#bbf7d0' },
        { id: 'checkout-submit-btn', label: 'Submit Payment', y: 320, h: 36, color: '#cbd5e1' }
      ];

      elementsToDraw.forEach(item => {
        ctx.fillStyle = item.color;
        ctx.fillRect(20, item.y, 280, item.h);
        ctx.fillStyle = '#1e293b';
        ctx.font = '12px sans-serif';
        ctx.fillText(item.label, 28, item.y + (item.h / 2) + 4);
      });

      return { canvas, elementsToDraw };
    }

    async function executePipeline({ simulateLeak = false } = {}) {
      clearLog();
      updateStats(0, 0, 0);

      log(`[INIT] Starting Dev 2 Redaction Pipeline ${simulateLeak ? '(SIMULATE LEAK MODE)' : ''}...`, 'info');
      await delay(400);

      // 1. Target DOM Elements
      const formEl = document.getElementById('fake-checkout-form');
      const targetElements = Array.from(formEl.querySelectorAll('input, button, div'));

      let scannedCount = 0;
      let redactedCount = 0;
      let sensitiveRegions = [];
      let elementSummaries = [];

      const { canvas: mockSourceCanvas, elementsToDraw } = drawMockFormCanvas();

      // Copy unredacted mock canvas to sanitized view initially
      const sCtx = sanitizedCanvas.getContext('2d');
      sCtx.drawImage(mockSourceCanvas, 0, 0);

      // Process elements
      for (const el of targetElements) {
        const elId = getElementId(el);
        scannedCount++;
        updateStats(scannedCount, redactedCount, 0);

        // Classify Element via DOM Heuristics
        const domClassification = classifyElement(el);

        // Detect PII in element value or innerText
        const val = el.value || el.innerText || '';
        const piiMatches = detectPII(val);

        if (piiMatches.length > 0) {
          piiMatches.forEach(m => {
            log(`[PII] Regex match: ${m.type} in ${elId}`, 'warn');
          });
          await delay(300);
        }

        // Confidence calculation
        const confidence = domClassification.is_sensitive ? 0.94 : (piiMatches.length > 0 ? 0.85 : 0.40);
        const tierInfo = classifySensitivityWithConfidence(domClassification, piiMatches, confidence);
        const badgeColor = getConfidenceBadgeColor(confidence);

        log(`[DOM] Detected: ${elId} -> type=${domClassification.sensitivity_type || 'NONE'}, tier=${tierInfo.sensitivity_tier}`, 'info');
        await delay(300);

        if (tierInfo.action === 'hard_redact' || tierInfo.action === 'soft_redact_flagged') {
          redactedCount++;
          updateStats(scannedCount, redactedCount, 0);

          log(`[TIER] ${elId} -> ${tierInfo.action}, confidence=${confidence.toFixed(2)} (${badgeColor})`, tierInfo.sensitivity_tier === 1 ? 'pass' : 'warn');
          await delay(300);

          // Find bounding box from mock canvas items for visual rendering
          const mockItem = elementsToDraw.find(item => item.id === elId);
          const bounding_box = mockItem ? { x: 20, y: mockItem.y, w: 280, h: mockItem.h } : { x: 20, y: 30, w: 280, h: 30 };
          
          let boxCategory = 'SHORT';
          if (bounding_box.w > 160) boxCategory = 'LONG';
          else if (bounding_box.w > 80) boxCategory = 'MEDIUM';

          log(`[REDACT] Drew solid box over ${elId} (${boxCategory} size)`, 'info');
          await delay(300);

          sensitiveRegions.push({
            bounding_box,
            sensitivity_tier: tierInfo.sensitivity_tier
          });
        }

        elementSummaries.push({
          element_id: elId,
          tag: domClassification.tag,
          role: domClassification.role,
          label_text: domClassification.label_text,
          is_sensitive: domClassification.is_sensitive,
          sensitivity_tier: tierInfo.sensitivity_tier,
          semantic_token: tierInfo.semantic_token
        });
      }

      // 2. Render Redacted Canvas
      log('[RENDER] Generating redacted image canvas...', 'info');
      await delay(400);

      const redactedCanvas = redactImage(mockSourceCanvas, sensitiveRegions);
      sCtx.clearRect(0, 0, sanitizedCanvas.width, sanitizedCanvas.height);
      sCtx.drawImage(redactedCanvas, 0, 0);

      const redactedBase64 = canvasToBase64(redactedCanvas);

      // 3. Build Payload
      const payload = {
        dom_summary: {
          url: window.location.href,
          elements: elementSummaries
        },
        redacted_image_base64: redactedBase64
      };

      // Inject leak if requested
      if (simulateLeak) {
        log('[SIMULATION] Injecting raw PII card number into payload...', 'warn');
        payload.dom_summary.elements.push({
          element_id: 'leaked-field',
          tag: 'input',
          role: null,
          label_text: '4111 1111 1111 1111', // Raw card number leaked!
          is_sensitive: true,
          sensitivity_tier: 1,
          semantic_token: '[CARD_NUMBER]'
        });
        await delay(400);
      }

      // 4. Leakage Auditor Check
      log('[AUDIT] Running assertSafeToSend() on outgoing payload...', 'info');
      await delay(400);

      try {
        assertSafeToSend(payload, detectPII);
        log('[AUDIT] Payload scan: 0 violations found. PASSED.', 'pass');
        updateStats(scannedCount, redactedCount, 0);
      } catch (err) {
        const auditRes = auditPayload(payload, detectPII);
        updateStats(scannedCount, redactedCount, auditRes.violations.length);
        log(`[LEAK DETECTED] ${err.message}`, 'fail');
        await delay(400);
        log('Leak blocked before transport', 'pass');
      }
    }

    document.getElementById('btn-run-pipeline').addEventListener('click', () => {
      executePipeline({ simulateLeak: false });
    });

    document.getElementById('btn-simulate-leak').addEventListener('click', () => {
      executePipeline({ simulateLeak: true });
    });
  </script>
</body>
</html>
